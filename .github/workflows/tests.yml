name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so setuptools-scm can work out the version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Build csv2sef
        run: uv build

      - name: Run the tests
        run: uv run python -m unittest discover -s tests -v

      - name: Convert the examples
        run: |
          cd examples/YorkFactoryHBC
          uv run csv2sef convert YorkFactory-HBC_1773_wide.csv YorkFactoryHBC_metadata.csv -o /tmp/out1
          uv run csv2sef convert YorkFactory-HBC_1773_long.csv YorkFactoryHBC_metadata.csv -o /tmp/out2
          cd ../Hebron
          uv run csv2sef convert Hebron_Pressure_1883-09_1883-12.csv Hebron_metadata.csv -o /tmp/out3
          cd ../HalifaxCitadel
          uv run csv2sef convert HalifaxCitadel_1863-1865.csv HalifaxCitadel_metadata.csv -o /tmp/out4
